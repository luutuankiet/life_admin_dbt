[project]
name = "ticktick-ingest"
version = "0.1.0"
description = "TickTick sync feed -> dlt -> BigQuery, orchestrated by Dagster"
requires-python = ">=3.11"
dependencies = [
  "dlt[bigquery]>=1.5",
  "dagster>=1.9",
  "dagster-webserver>=1.9",
  "httpx>=0.27",
  "websockets>=13",
]

[dependency-groups]
dev = [
  "duckdb>=1.5.6",
  "pytest>=8",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ticktick_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
