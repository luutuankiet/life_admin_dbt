# systemd drop-in for docker.service: start dockerd only after Tailscale has an IP.
#
# Why: the Dagster UI port is published on the host's tailnet address
# (DAGSTER_WEB_BIND). If dockerd starts before tailscaled has assigned that
# address, the port bind fails with "cannot assign requested address", the
# container stays down, and a restart policy does not retry it.
#
# Install on the host (no docker restart needed; takes effect on next boot):
#   sudo install -D -m 0644 wait-for-tailscale.conf \
#     /etc/systemd/system/docker.service.d/wait-for-tailscale.conf
#   sudo systemctl daemon-reload
#
# The wait is bounded and its failure is ignored (the leading "-"), so a host
# where Tailscale is logged out or broken still starts docker after 60 s; only
# the tailnet-bound port is lost in that case, every other container comes up.
# The packaged tailscale-online.target is not used because it waits forever.

[Unit]
Wants=tailscaled.service
After=tailscaled.service

[Service]
ExecStartPre=-/usr/bin/tailscale wait --timeout=60s
