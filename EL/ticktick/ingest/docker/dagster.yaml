# Instance config, baked into the image at $DAGSTER_HOME. Run, event and schedule
# storage live on the shared `state` volume so they survive a rebuild.
storage:
  sqlite:
    base_dir: /state/dagster

local_artifact_storage:
  module: dagster._core.storage.root
  class: LocalArtifactStorage
  config:
    base_dir: /state/dagster/artifacts

# One sync at a time: two runs on the same dlt working dir would race the bookmark.
run_queue:
  max_concurrent_runs: 1

# Fail runs whose worker is gone, so one cannot hold the single run slot forever.
# A container stop mid-run leaves the run STARTED with no process behind it. The
# default run launcher (what `dagster dev` uses) cannot check worker health, so for a
# STARTED run the monitor only enforces max_runtime_seconds: past it, the run is
# marked failed (the failure sensor alerts) and the queue moves on. Normal runs take
# about a minute; 30 min leaves room for a cold backfill. The launcher cannot resume
# runs either, so max_resume_run_attempts must stay 0.
run_monitoring:
  enabled: true
  start_timeout_seconds: 300
  cancel_timeout_seconds: 180
  max_runtime_seconds: 1800
  max_resume_run_attempts: 0
  poll_interval_seconds: 60

# Tick history. Run history (7 days) is purged by the purge_old_runs_daily schedule,
# since OSS Dagster has no run retention setting.
retention:
  schedule:
    purge_after_days:
      skipped: 1
      success: 7
      failure: 7
  sensor:
    purge_after_days:
      skipped: 1
      success: 7
      failure: 7

telemetry:
  enabled: false
